[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "PatchPilot: AI coding agent whose tool access is mediated by the AgntID runtime"
requires-python = ">=3.11"
dependencies = [
    # AgntID Python SDK source version 0.2.0. The published wheel is still 0.1.1,
    # so the docs direct us to the source checkout; pinned to the inspected commit.
    "agntid-sdk @ git+https://github.com/AGNTID-AI/agntid-python.git@f4fcd2fe476f0c4dcf800e498530b7042b830f6b",
    # Reads the local .env file without exporting it into the process environment.
    "python-dotenv>=1.0,<2",
    # Validates capability mappings and arguments against discovered inputSchemas.
    # Already installed by the SDK's mcp dependency; declared because we import it.
    "jsonschema>=4.20,<5",
    # Web UI backend (patchpilot-ui). Both are already installed through the
    # SDK's mcp dependency; declared because PatchPilot now imports them.
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
]

[project.scripts]
patchpilot-discover = "patchpilot.discover_cli:main"
patchpilot-github-preflight = "patchpilot.github_preflight_cli:main"
patchpilot-patch = "patchpilot.patch_cli:main"
patchpilot-ui = "patchpilot.ui_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchpilot*"]

[tool.setuptools.package-data]
# Built frontend (npm --prefix frontend run build); not committed.
"patchpilot.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: connects to the real AgntID runtime in AGNTID_MCP_URL (opt-in with AGNTID_LIVE_TEST=1)",
]
